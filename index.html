<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CANTO — Live Subtitles</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Control panel -->
  <div id="controls">
    <div id="title">CANTO</div>
    <div id="tagline">粵語即時字幕 · Live Subtitles</div>

    <div id="mode-row">
      <button id="listenBtn" class="mode-btn active" data-mode="listen">LISTEN</button>
      <button id="speakBtn"  class="mode-btn"        data-mode="speak">SPEAK</button>
    </div>

    <div id="status-row">
      <span id="mic-dot"></span>
      <span id="status">STARTING...</span>
    </div>
    <div id="browser-warn">⚠ Chrome or Edge required</div>
  </div>

  <!-- Subtitle display -->
  <div id="subtitle-container">
    <span id="subtitle-interim"></span>
    <span id="subtitle-cantonese" class="subtitle-line"></span>
    <span id="subtitle-english"   class="subtitle-line"></span>
  </div>

  <!-- Replay button (speak mode only) -->
  <div id="play-btn-wrap">
    <button id="playBtn">&#9654; PLAY CANTONESE</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
