<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CANTO — Live Subtitles</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Control panel -->
  <div id="controls">
    <div id="title">CANTO</div>
    <div id="tagline">粵語即時字幕 · Live Subtitles</div>

    <div id="mode-row">
      <button id="listenBtn" class="mode-btn active" data-mode="listen">LISTEN</button>
      <button id="speakBtn"  class="mode-btn"        data-mode="speak">SPEAK</button>
    </div>

    <div id="mode-hint"></div>

    <div id="status-row">
      <span id="mic-dot"></span>
      <span id="status">STARTING...</span>
    </div>

    <div id="play-btn-wrap">
      <button id="playBtn">&#9654; PLAY CANTONESE</button>
    </div>

    <button id="clearBtn">&#10005; CLEAR</button>

    <div id="browser-warn">⚠ Chrome or Edge required</div>
  </div>

  <!-- Subtitle display -->
  <div id="subtitle-container">
    <span id="subtitle-interim"></span>
    <span id="subtitle-cantonese" class="subtitle-line"></span>
    <span id="subtitle-english"   class="subtitle-line"></span>
  </div>

  <!-- First-run onboarding card -->
  <div id="onboarding">
    <div id="onboarding-card">
      <div id="onboarding-title">WELCOME TO CANTO</div>
      <div class="onboarding-mode">
        <span class="ob-label listen-label">LISTEN</span>
        Speak Cantonese — real-time English subtitles appear at the bottom of the screen.
      </div>
      <div class="onboarding-mode">
        <span class="ob-label speak-label">SPEAK</span>
        Say anything in English — CANTO translates and reads it aloud in Cantonese.
      </div>
      <div id="onboarding-footer">
        <div id="onboarding-bar"></div>
        <button id="onboarding-dismiss">GOT IT  &#10230;</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
