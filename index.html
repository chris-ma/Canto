<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CANTO — Live Subtitles</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Control panel -->
  <div id="controls">
    <div id="title">CANTO</div>
    <div id="tagline">粵語即時字幕 · Live Subtitles</div>
    <div id="status">IDLE</div>

    <div class="btn-row">
      <button id="startBtn">START</button>
      <button id="stopBtn" disabled>STOP</button>
    </div>

    <label class="toggle-row">
      <input type="checkbox" id="showCantonese" checked>
      Show Cantonese
    </label>

    <div id="browser-warn">⚠ Chrome or Edge required</div>
  </div>

  <!-- Subtitle display -->
  <div id="subtitle-container">
    <span id="subtitle-interim"></span>
    <span id="subtitle-cantonese" class="subtitle-line"></span>
    <span id="subtitle-english"   class="subtitle-line"></span>
  </div>

  <script src="app.js"></script>
</body>
</html>
